name: Static CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full git history is required for gitleaks and cz --rev-range.

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail

          # docker compose is already available on GitHub-hosted ubuntu runners.
          docker compose version
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pip
          fi
          python3 -m pip install --user yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare safe Compose interpolation values
        shell: bash
        run: |
          # Safe because .env is ignored by .gitignore and .env.example contains placeholders, not real secrets.
          cp .env.example .env
          grep -q '^OPENAPI_MCP_HEADERS=' .env || echo 'OPENAPI_MCP_HEADERS=Authorization=Bearer dummy-token' >> .env

      - name: Hadolint Dockerfiles
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 dockerfiles/sandbox.Dockerfile
          docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 dockerfiles/mcphub.Dockerfile

      - name: Validate Compose syntax and interpolation
        run: docker compose -f docker-compose.yml config -q

      - name: Lint YAML files
        run: yamllint -d "{extends: relaxed, rules: {truthy: {allowed-values: ['true', 'false', 'on', 'off']}}}" docker-compose.yml .github/workflows/ci.yml

      - name: Lint GitHub workflow syntax
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7

      - name: Secret scan with gitleaks
        continue-on-error: true
        run: docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 detect --source /repo --verbose

      - name: Trivy filesystem scan
        continue-on-error: true
        run: docker run --rm -v "$PWD":/repo -w /repo aquasec/trivy:0.53.0 fs /repo

      - name: Trivy config scan
        continue-on-error: true
        run: docker run --rm -v "$PWD":/repo -w /repo aquasec/trivy:0.53.0 config docker-compose.yml dockerfiles/

      - name: Validate conventional commits with commitizen
        shell: bash
        run: |
          # Mirrors local commit gate in .githooks/commit-msg (which uses --commit-msg-file) with CI-safe rev-range linting.
          uv sync --group dev
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            REV_RANGE="origin/main..HEAD"
          else
            REV_RANGE="$(git rev-list --max-count=2 HEAD | tail -n 1)..HEAD"
          fi
          uv run cz check --rev-range "$REV_RANGE"

      - name: Build-free policy reminder
        run: |
          # tests/ are live-stack integration tests (openai/httpx against running services such as vLLM /health), so they are excluded here.
          # This CI is static-only: no docker build, no compose up/run, no pytest.
          echo "Static analysis complete."
